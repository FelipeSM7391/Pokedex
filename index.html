<!DOCTYPE html>
<html lang="en"><!--linguagem-->
<head>              <!--caracter-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <!--icone da pagina-->
    <link rel="icon" href="./favicons/favicon-16asdasdx16.png">

                                <!--linka com o css-->
    <link rel="stylesheet" href="./css/style.css">

    <script defer src="./js/script.js"></script>

    <title>Pokédex_FSM</title>
</head>
<body>

    <main>
        <section class="rotom">
            <img src="./images/pokedex_ofc.jpeg" alt="Rotom-dex" class="rotom_body">

            <div class="screen">
                <div class="sprite_stage">
                    <img src="./images/Pok-dex-DO-FelipeSM-15-04-2026.png" alt="pokemon" class="pokemon_image">
                </div>

                <h1 class="pokemon_data">
                    <span class="pokemon_num">!!!</span> -
                    <span class="pokemon_name">Boas vindas</span>
                </h1>
            </div>
        </section>

        <section class="panel">
            <form class="form">
                <label class="sr_only" for="search">Pokémon name or number</label>
                <input
                id="search"
                type="search"
                class="input_search"
                placeholder="Name or Pokémon number"
                autocomplete="off"
                required
                />
            </form>

            <div class="buttons">
                <button class="button btn-prev">&lt; Prev </button>
                <button class="button btn-next">Next &gt;</button>
            </div>
        </section>

    </main>
</body>
</html>
